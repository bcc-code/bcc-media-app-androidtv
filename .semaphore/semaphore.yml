version: v1.0
name: BCC Media Android TV
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
blocks:
  - name: Build
    dependencies: []
    task:
      secrets:
        - name: android-keystore-bcc-media-apps
        - name: android-play-store-api-linux
        - name: android-npaw
        - name: android-rudderstack
        - name: android-sentry
      prologue:
        commands:
          - checkout
          - sem-version java 21
      jobs:
        - name: Build release AAB
          commands:
            - cp /home/semaphore/google-play-service-account.json fastlane/google-play-service-account.json
            - export ANDROID_HOME="$HOME/android-sdk"
            - cache restore android-sdk
            - 'cache restore gradle-$(checksum gradle/libs.versions.toml),gradle'
            - .semaphore/scripts/build-release-aab.sh
            - cache store android-sdk $ANDROID_HOME || true
            - cache store gradle-$(checksum gradle/libs.versions.toml) ~/.gradle/caches || true
            - artifact push workflow app/build/outputs/bundle/release/app-release.aab -d app-release.aab
            - artifact push workflow fastlane/.next_version_code -d build-number
  - name: Deploy
    dependencies:
      - Build
    task:
      secrets:
        - name: android-play-store-api-linux
      jobs:
        - name: Upload to Google Play Internal
          commands:
            - checkout
            - cp /home/semaphore/google-play-service-account.json fastlane/google-play-service-account.json
            - artifact pull workflow app-release.aab -d app/build/outputs/bundle/release/app-release.aab
            - bundle install
            - bundle exec fastlane internal
promotions:
  - name: Promote to Beta
    pipeline_file: promote-track.yml
    deployment_target: beta
    parameters:
      env_vars:
        - name: SOURCE_TRACK
          required: true
          default_value: 'tv:internal'
          description: Google Play track the build is currently on
          options:
            - 'tv:internal'
        - name: DEST_TRACK
          required: true
          default_value: 'tv:beta'
          description: Google Play track to promote to
          options:
            - 'tv:beta'
  - name: Promote to Prod
    pipeline_file: promote-track.yml
    deployment_target: prod
    parameters:
      env_vars:
        - name: SOURCE_TRACK
          required: true
          default_value: 'tv:internal'
          description: Google Play track the build is currently on
          options:
            - 'tv:internal'
        - name: DEST_TRACK
          required: true
          default_value: 'tv:production'
          description: Google Play track to promote to
          options:
            - 'tv:production'
